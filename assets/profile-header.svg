<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">LowkyFoolDev — Somyajit's developer profile</title>
  <desc id="desc">A midnight blue banner with cyan and violet orbital motion surrounding a code symbol. Learn, build, iterate, repeat.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e20"/><stop offset=".6" stop-color="#101c35"/><stop offset="1" stop-color="#171433"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#6366f1" stop-opacity=".26"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#64748b" stroke-opacity=".1"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="frame"><rect x="1" y="1" width="1098" height="338" rx="20"/></clipPath>
  </defs>
  <style>
    .sans {font-family:Arial,Helvetica,sans-serif}
    .mono {font-family:'Courier New',monospace}
    .orbit {transform-origin:858px 164px;animation:orbit 22s linear infinite}
    .reverse {animation-direction:reverse;animation-duration:31s}
    .pulse {animation:pulse 5s ease-in-out infinite}
    .signal {stroke-dasharray:16 520;animation:signal 9s linear infinite}
    .stars {animation:stars 6s ease-in-out infinite alternate}
    @keyframes orbit {to {transform:rotate(360deg)}}
    @keyframes pulse {0%,100% {opacity:.45}50% {opacity:.95}}
    @keyframes signal {to {stroke-dashoffset:-1072}}
    @keyframes stars {from {opacity:.25}to {opacity:.85}}
    @media (prefers-reduced-motion:reduce) {* {animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1100" height="340" fill="url(#bg)"/>
    <rect width="1100" height="340" fill="url(#grid)"/>
    <circle cx="858" cy="164" r="220" fill="url(#aura)" class="pulse"/>
    <path d="M0 288C220 212 330 370 580 267S925 198 1100 255" fill="none" stroke="#67e8f9" stroke-opacity=".1"/>
    <path d="M0 288C220 212 330 370 580 267S925 198 1100 255" fill="none" stroke="#67e8f9" stroke-width="2" class="signal" opacity=".5"/>
    <g class="stars" fill="#a5b4fc"><circle cx="620" cy="48" r="2"/><circle cx="1038" cy="90" r="2"/><circle cx="688" cy="254" r="2"/><circle cx="987" cy="282" r="1.5"/><circle cx="530" cy="52" r="1.5"/></g>
    <g transform="translate(48 44)">
      <circle cx="5" cy="5" r="4" fill="#67e8f9" class="pulse"/>
      <text x="20" y="10" class="mono" fill="#a5b4c9" font-size="12" letter-spacing="2.4">SOMYAJIT / DEVELOPER LOG</text>
      <text x="0" y="92" class="sans" font-size="64" font-weight="700" letter-spacing="-2" fill="#f1f5ff">LowkyFoolDev<tspan fill="#67e8f9">.</tspan></text>
      <text x="2" y="136" class="sans" font-size="23" fill="#b7c7e0">Exploring intelligent software.</text>
      <g class="mono" font-size="12" letter-spacing="1.2">
        <rect x="0" y="166" width="71" height="30" rx="15" fill="#67e8f9" fill-opacity=".08" stroke="#67e8f9" stroke-opacity=".25"/>
        <text x="25" y="186" fill="#67e8f9">AI</text>
        <rect x="83" y="166" width="137" height="30" rx="15" fill="#a5b4fc" fill-opacity=".08" stroke="#a5b4fc" stroke-opacity=".25"/>
        <text x="102" y="186" fill="#c7d2fe">FULL STACK</text>
        <rect x="232" y="166" width="78" height="30" rx="15" fill="#c4b5fd" fill-opacity=".08" stroke="#c4b5fd" stroke-opacity=".25"/>
        <text x="255" y="186" fill="#ddd6fe">C++</text>
      </g>
      <text x="2" y="260" class="mono" font-size="12" fill="#7f94b3" letter-spacing="1.1">LEARN / BUILD / ITERATE / REPEAT</text>
    </g>
    <g fill="none" stroke="#818cf8" stroke-opacity=".2"><circle cx="858" cy="164" r="116"/><circle cx="858" cy="164" r="138" stroke-dasharray="2 12"/><ellipse cx="858" cy="164" rx="154" ry="57" transform="rotate(-30 858 164)"/><ellipse cx="858" cy="164" rx="154" ry="57" transform="rotate(30 858 164)"/></g>
    <g class="orbit" fill="none">
      <circle cx="858" cy="164" r="116" stroke="url(#accent)" stroke-width="2" stroke-dasharray="115 614" stroke-linecap="round"/>
      <circle cx="974" cy="164" r="9" fill="#67e8f9" filter="url(#glow)" opacity=".65"/>
      <circle cx="974" cy="164" r="4" fill="#a5f3fc"/>
    </g>
    <g class="orbit reverse"><circle cx="858" cy="164" r="138" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="42 825"/><circle cx="720" cy="164" r="4.5" fill="#c4b5fd"/><circle cx="720" cy="164" r="10" fill="#c4b5fd" opacity=".3" filter="url(#glow)"/></g>
    <circle cx="858" cy="164" r="72" fill="#0c1630" stroke="#818cf8" stroke-opacity=".5"/>
    <circle cx="858" cy="164" r="61" fill="none" stroke="#67e8f9" stroke-opacity=".12" class="pulse"/>
    <path d="M833 145L814 164L833 183M883 145L902 164L883 183M867 139L849 189" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="858" y="320" text-anchor="middle" class="mono" font-size="10" fill="#8091b2" letter-spacing="2">CURIOSITY → CODE</text>
    <rect x="0" y="337" width="1100" height="3" fill="url(#accent)" opacity=".85"/>
  </g>
  <rect x="1" y="1" width="1098" height="338" rx="20" fill="none" stroke="#293851"/>
</svg>
