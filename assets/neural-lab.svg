<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
<title id="title">LowkyFoolDev — Neural Lab</title>
<desc id="desc">An animated neural network sends cyan and violet data pulses into a rotating code core and a terminal. Learn, build, iterate, repeat. Decorative animation; no live metrics.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e20"/><stop offset="1" stop-color="#15132e"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-opacity=".045"/></pattern>
 <clipPath id="frame"><rect x="1" y="1" width="1098" height="348" rx="20"/></clipPath>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif}.mono,.mono text{font-family:'Courier New',monospace}
 .packet{stroke-dasharray:9 91;animation:flow 3s linear infinite;stroke-linecap:round}
 .node{animation:breath 3s ease-in-out infinite}
 .orbit{transform-origin:555px 182px;animation:spin 16s linear infinite}
 .reverse{animation-direction:reverse;animation-duration:23s}
 .scan{animation:scan 6s ease-in-out infinite}
 .cursor{animation:blink 1s step-end infinite}
 .step{animation:step 8s ease-in-out infinite}
 @keyframes flow{to{stroke-dashoffset:-100}}
 @keyframes breath{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes scan{0%,100%{transform:translateY(0);opacity:0}10%,90%{opacity:.4}50%{transform:translateY(126px);opacity:.4}}
 @keyframes blink{50%{opacity:0}}
 @keyframes step{0%,8%,35%,100%{opacity:.28}15%,25%{opacity:1}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.scan,.cursor{display:none}.node,.step{opacity:1}}
</style>
